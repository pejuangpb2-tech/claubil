<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[{"id":"creator","type":"string","label":"Creator name","default":"fanad"},{"id":"tagline1","type":"string","label":"Tagline line 1","default":"One app."},{"id":"tagline2","type":"string","label":"Tagline line 2","default":"Every song."}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #040806;
        --ink: #effff5;
        --green: #1ed760;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="phone" data-composition-id="phone" data-composition-src="compositions/phone.html"
        data-start="3" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="discover" data-composition-id="discover" data-composition-src="compositions/discover.html"
        data-start="7" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="wrapped" data-composition-id="wrapped" data-composition-src="compositions/wrapped.html"
        data-start="10.2" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="jam" data-composition-id="jam" data-composition-src="compositions/jam.html"
        data-start="13.4" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="devices" data-composition-id="devices" data-composition-src="compositions/devices.html"
        data-start="16.4" data-duration="2.8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="tagline" data-composition-id="tagline" data-composition-src="compositions/tagline.html"
        data-start="19.2" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"
        data-variable-values='{"tagline1":"One app.","tagline2":"Every song."}'></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="21.4" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"
        data-variable-values='{"creator":"fanad"}'></div>

      <!-- Effects only: each peak lands one frame after its picture -->
      <audio id="sfx-comet" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.37" data-duration="0.575" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.96" data-duration="2.12" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-out1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.62" data-duration="0.575" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.72" data-duration="0.575" data-track-index="10" data-volume="0.65"></audio>
      <audio id="sfx-covers" class="clip" src="assets/sfx/sparkle.mp3" data-start="7.55" data-duration="1.8" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.82" data-duration="0.575" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-count" class="clip" src="assets/sfx/ping.mp3" data-start="11.51" data-duration="1.32" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-chip" class="clip" src="assets/sfx/pop.mp3" data-start="11.94" data-duration="0.72" data-track-index="13" data-volume="0.8"></audio>
      <audio id="sfx-jam1" class="clip" src="assets/sfx/pop.mp3" data-start="14.03" data-duration="0.72" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-jam2" class="clip" src="assets/sfx/click-soft.mp3" data-start="14.31" data-duration="0.37" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-jam3" class="clip" src="assets/sfx/pop.mp3" data-start="14.53" data-duration="0.72" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-jam4" class="clip" src="assets/sfx/click-soft.mp3" data-start="14.81" data-duration="0.37" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-up" class="clip" src="assets/sfx/whoosh.mp3" data-start="16.07" data-duration="0.575" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-devices" class="clip" src="assets/sfx/sparkle.mp3" data-start="17.35" data-duration="1.8" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.78" data-duration="0.575" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-iris" class="clip" src="assets/sfx/whoosh.mp3" data-start="21.0" data-duration="0.575" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="19.70" data-duration="2.59" data-track-index="11" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
