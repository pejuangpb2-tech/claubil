    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // short, decaying camera shake (fixed offsets, so every seek renders the same frame)
      const SHAKE = [[-1, 0.5], [0.85, -0.7], [-0.6, 0.45], [0.4, -0.3], [-0.2, 0.15], [0, 0]];
      function shake(t, amp) {
        SHAKE.forEach(([sx, sy], i) => {
          tl.to("#cam", { x: sx * amp, y: sy * amp, duration: 0.035, ease: "none" }, t + i * 0.035);
        });
      }
      // hook: the frame zooms out onto the scene while the title slams in
      tl.fromTo("#cam", { scale: 1.18 }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0);
      shake(0.12, 16);
      // each Perak word: 12% punch-in with a shake, released at the next cut
      [6.5, 14.1, 28.233, 37.3, 45.7, 52.733].forEach((t) => {
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.12, duration: 0.22, ease: "power3.out", immediateRender: false }, t);
        shake(t, 18);
      });
      [9.2, 18.767, 31.433, 40.133, 48.433].forEach((t) => tl.set("#cam", { scale: 1 }, t));
      // outro slam
      shake(55.35, 14);
      window.__timelines["main"] = tl;
    </script>
