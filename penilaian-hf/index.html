<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Baloo 2"; src: url("assets/fonts/baloo-2-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Baloo 2"; src: url("assets/fonts/baloo-2-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #7cc6f1; font-family: "Baloo 2", sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(180deg, #7cc6f1, #bfe6fb 60%, #a7dc8e 60.2%, #86c96f); }
      .shot { position: absolute; inset: 0; }
      .frame { position: absolute; left: 240px; top: 70px; width: 1440px; height: 810px; border: 14px solid #fff; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 0 rgba(150,100,60,.2), 0 40px 60px rgba(40,70,120,.3); background: #a9dcf7; }
      .frame img { display: block; width: 100%; height: 100%; }
      .cap { position: absolute; left: 50%; top: 920px; transform: translateX(-50%); white-space: nowrap; background: #c23a64; color: #fff; border: 7px solid #fff; border-radius: 999px; padding: 4px 44px; font-weight: 800; font-size: 54px; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
      .cap span { display: inline-block; min-width: 0; margin-right: 14px; color: #ffe27a; }
      .cap span:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <div id="s0" class="clip shot" data-start="0" data-duration="4" data-track-index="1">
        <div class="frame"><img id="s0-img" src="assets/s0.png" alt="" /></div>
        <div id="s0-cap" class="cap"><span></span>Murid tulis nama</div>
      </div>
      <div id="s1" class="clip shot" data-start="4" data-duration="4" data-track-index="1">
        <div class="frame"><img id="s1-img" src="assets/s1.png" alt="" /></div>
        <div id="s1-cap" class="cap"><span>1</span>Perasaan saya</div>
      </div>
      <div id="s2" class="clip shot" data-start="8" data-duration="4" data-track-index="1">
        <div class="frame"><img id="s2-img" src="assets/s2.png" alt="" /></div>
        <div id="s2-cap" class="cap"><span>2</span>Penilaian kendiri</div>
      </div>
      <div id="s3" class="clip shot" data-start="12" data-duration="4" data-track-index="1">
        <div class="frame"><img id="s3-img" src="assets/s3.png" alt="" /></div>
        <div id="s3-cap" class="cap"><span>3</span>Refleksi saya</div>
      </div>
      <div id="s4" class="clip shot" data-start="16" data-duration="4" data-track-index="1">
        <div class="frame"><img id="s4-img" src="assets/s4.png" alt="" /></div>
        <div id="s4-cap" class="cap"><span></span>Terima kasih!</div>
      </div>
      <div id="s5" class="clip shot" data-start="20" data-duration="4" data-track-index="1">
        <div class="frame"><img id="s5-img" src="assets/s5.png" alt="" /></div>
        <div id="s5-cap" class="cap"><span></span>Papan Cikgu: semua maklum balas</div>
      </div>
      <audio id="music" src="assets/bed.mp3" data-start="0" data-duration="24" data-track-index="3" data-volume="0.35" data-fade-out="1.5"></audio>
      <audio id="wh0" src="assets/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="wh1" src="assets/whoosh-short.mp3" data-start="4" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
      <audio id="wh2" src="assets/whoosh-short.mp3" data-start="8" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="wh3" src="assets/whoosh-short.mp3" data-start="12" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
      <audio id="wh4" src="assets/whoosh-short.mp3" data-start="16" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="wh5" src="assets/whoosh-short.mp3" data-start="20" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s0 .frame", { scale: 0.96, y: 0, opacity: 1 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.05);
      tl.fromTo("#s0-img", { scale: 1 }, { scale: 1.05, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#s0-cap", { y: 0, opacity: 1 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 0.35);
      tl.fromTo("#s1 .frame", { scale: 0.86, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 4.05);
      tl.fromTo("#s1-img", { scale: 1 }, { scale: 1.05, duration: 3.8, ease: "none" }, 4);
      tl.fromTo("#s1-cap", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 4.35);
      tl.fromTo("#s2 .frame", { scale: 0.86, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 8.05);
      tl.fromTo("#s2-img", { scale: 1 }, { scale: 1.05, duration: 3.8, ease: "none" }, 8);
      tl.fromTo("#s2-cap", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 8.35);
      tl.fromTo("#s3 .frame", { scale: 0.86, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 12.05);
      tl.fromTo("#s3-img", { scale: 1 }, { scale: 1.05, duration: 3.8, ease: "none" }, 12);
      tl.fromTo("#s3-cap", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 12.35);
      tl.fromTo("#s4 .frame", { scale: 0.86, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 16.05);
      tl.fromTo("#s4-img", { scale: 1 }, { scale: 1.05, duration: 3.8, ease: "none" }, 16);
      tl.fromTo("#s4-cap", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 16.35);
      tl.fromTo("#s5 .frame", { scale: 0.86, y: 40, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 20.05);
      tl.fromTo("#s5-img", { scale: 1 }, { scale: 1.05, duration: 3.8, ease: "none" }, 20);
      tl.fromTo("#s5-cap", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 20.35);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
