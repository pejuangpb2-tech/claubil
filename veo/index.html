<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      .shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- Shot 1: the salam, close. Generated by tools/veo.py from veo/prompts/shot1.txt -->
      <video
        id="shot1"
        class="clip shot"
        src="assets/shot1.mp4"
        data-start="0"
        data-duration="5"
        data-media-start="1"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
        playsinline
        style="z-index: 1"
      ></video>
      <!-- Shot 2: the whole morning, wide. Generated from veo/prompts/shot2.txt -->
      <video
        id="shot2"
        class="clip shot"
        src="assets/shot2.mp4"
        data-start="5"
        data-duration="5"
        data-media-start="0.5"
        data-track-index="1"
        data-has-audio="true"
        data-volume="1"
        data-fade-out="0.8"
        playsinline
        style="z-index: 2"
      ></video>
      <div
        id="ucapan"
        data-composition-id="ucapan"
        data-composition-src="compositions/ucapan.html"
        data-start="5"
        data-duration="5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
