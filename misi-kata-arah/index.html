<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Nunito KA"; font-weight: 800; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Nunito KA"; font-weight: 900; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); }
      /* Palet video contoh (diukur daripada kata_arah_ipan_1.mp4) */
      :root {
        --space: #1E194C;
        --space-deep: #150F3A;
        --moon: #493F8F;
        --crater: #3C3579;
        --yellow: #FDD13F;
        --coral: #FE585F;
        --cyan: #3EBFD2;
        --orange: #FE8B42;
        --cream: #F4EFEA;
        --lilac: #9B8CFF;
        --pink: #F48FB1;
        --teal: #35D0BA;
        --ink: #1A1442;
        --font: "Nunito KA", "Nunito", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: #fff; }

      /* Latar angkasa: 3 lapisan bintang (parallax dalam video) */
      .sky { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 40%, #241E58 0%, var(--space) 60%, var(--space-deep) 100%); }
      .stars { position: absolute; inset: -40px; background-repeat: repeat; }
      .stars.s1 { background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff 60%, transparent), radial-gradient(1.2px 1.2px at 140px 90px, #D9D2FF 60%, transparent), radial-gradient(1.4px 1.4px at 230px 180px, #fff 60%, transparent), radial-gradient(1.1px 1.1px at 80px 220px, #FFE7A8 60%, transparent); background-size: 260px 260px; opacity: .55; }
      .stars.s2 { background-image: radial-gradient(2.2px 2.2px at 60px 120px, #fff 60%, transparent), radial-gradient(1.8px 1.8px at 330px 40px, #fff 60%, transparent), radial-gradient(2px 2px at 420px 300px, #FFE7A8 60%, transparent); background-size: 520px 380px; opacity: .8; }
      .stars.s3 { background-image: radial-gradient(3px 3px at 200px 160px, #fff 55%, transparent), radial-gradient(2.6px 2.6px at 900px 520px, #fff 55%, transparent); background-size: 1100px 760px; opacity: .9; }

      /* Bar kemajuan misi: 5 planet */
      .prog { position: absolute; top: 34px; left: 560px; width: 800px; height: 72px; }
      .prog .line { position: absolute; left: 30px; right: 30px; top: 34px; border-top: 5px dashed rgba(244,239,234,.35); }
      .prog .line-done { position: absolute; left: 30px; top: 32px; height: 9px; border-radius: 9px; background: var(--yellow); }
      .prog .pl { position: absolute; top: 12px; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; font: 900 26px var(--font); color: var(--ink); opacity: .38; }
      .prog .pl.on { opacity: 1; box-shadow: 0 0 0 5px rgba(253,209,63,.9); }
      .prog .pl.done { opacity: 1; }
      .prog .p1 { left: 30px; background: var(--coral); } .prog .p2 { left: 215px; background: var(--cyan); } .prog .p3 { left: 400px; background: var(--yellow); }
      .prog .p4 { left: 585px; background: var(--orange); } .prog .p5 { left: 770px; background: var(--lilac); }
      .prog .rkt { position: absolute; top: -18px; width: 86px; height: 40px; }

      /* Tajuk stesen kecil (kiri atas) */
      .tag { position: absolute; left: 96px; top: 136px; font: 900 40px var(--font); color: var(--cream); background: rgba(21,15,58,.75); border: 3px solid rgba(244,239,234,.25); border-radius: 999px; padding: 6px 24px; }
      .tag b { color: var(--yellow); }

      /* Ayat utama (karaoke) */
      .sentence { position: absolute; left: 80px; right: 80px; text-align: center; font: 900 74px/1.2 var(--font); color: #fff; text-shadow: 0 5px 0 rgba(10,7,32,.55); }
      .sentence .w { display: inline-block; margin: 0 .12em; }
      .sentence .dim { opacity: .4; }
      .ka { color: var(--yellow); text-decoration: underline; text-decoration-thickness: 8px; text-underline-offset: 14px; }
      .c-di { color: var(--pink); } .c-ke { color: var(--orange); } .c-dari { color: var(--teal); }

      /* Label kata arah "pop" */
      .label-ka { position: absolute; font: 900 124px/1 var(--font); color: var(--yellow); letter-spacing: 2px; text-shadow: 0 7px 0 #0F0B2E; }

      /* Kapsyen dibakar */
      .cap { position: absolute; left: 50%; bottom: 44px; width: 1560px; margin-left: -780px; text-align: center; font: 800 52px/1.3 var(--font); color: #fff; background: rgba(12,9,38,.78); border-radius: 26px; padding: 14px 36px 18px; }
      .cap .cw { opacity: .55; } .cap .cw.said { opacity: 1; } .cap .cw.now { opacity: 1; color: #fff; background: rgba(62,191,210,.35); border-radius: 10px; padding: 0 6px; }
      .cap .ka { text-decoration-thickness: 5px; text-underline-offset: 9px; opacity: 1; }
    </style>
  </head>
  <body>
