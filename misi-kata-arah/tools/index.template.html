<!doctype html>

<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Nunito KA"; font-weight: 800; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Nunito KA"; font-weight: 900; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); }
      :root {
        --space: #1E194C; --space-deep: #150F3A; --moon: #493F8F; --crater: #3C3579;
        --yellow: #FDD13F; --coral: #FE585F; --cyan: #3EBFD2; --orange: #FE8B42; --cream: #F4EFEA;
        --lilac: #9B8CFF; --pink: #F48FB1; --teal: #35D0BA; --green: #6CCB4E; --ink: #1A1442;
        --font: "Nunito KA", "Nunito", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: #fff; }
      .sky { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 40%, #241E58 0%, var(--space) 60%, var(--space-deep) 100%); }
      .stars { position: absolute; top: -60px; bottom: -60px; left: -60px; width: 2600px; background-repeat: repeat; }
      .stars.s1 { background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff 60%, transparent), radial-gradient(1.2px 1.2px at 140px 90px, #D9D2FF 60%, transparent), radial-gradient(1.4px 1.4px at 230px 180px, #fff 60%, transparent), radial-gradient(1.1px 1.1px at 80px 220px, #FFE7A8 60%, transparent); background-size: 260px 260px; opacity: .55; }
      .stars.s2 { background-image: radial-gradient(2.2px 2.2px at 60px 120px, #fff 60%, transparent), radial-gradient(1.8px 1.8px at 330px 40px, #fff 60%, transparent), radial-gradient(2px 2px at 420px 300px, #FFE7A8 60%, transparent); background-size: 520px 380px; opacity: .8; }
      .stars.s3 { background-image: radial-gradient(3px 3px at 200px 160px, #fff 55%, transparent), radial-gradient(2.6px 2.6px at 900px 520px, #fff 55%, transparent); background-size: 1100px 760px; opacity: .9; }

      /* ===== komponen bersama ===== */
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }
      .stn { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
      .stn-planet { display: inline-grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--ink); font: 900 84px var(--font); color: var(--ink); box-shadow: 0 10px 0 rgba(10,7,32,.55); }
      .stn-kicker { font: 900 58px var(--font); letter-spacing: 8px; color: var(--yellow); margin-top: 26px; }
      .stn-title { font: 900 104px/1.05 var(--font); color: #fff; text-shadow: 0 8px 0 #0F0B2E; margin-top: 8px; }
      .pc1 { background: var(--coral); } .pc2 { background: var(--cyan); } .pc3 { background: var(--yellow); } .pc4 { background: var(--orange); } .pc5 { background: var(--lilac); }
      .warp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }

      .tag { position: absolute; left: 96px; top: 136px; font: 900 42px var(--font); color: var(--cream); background: rgba(21,15,58,.8); border: 3px solid rgba(244,239,234,.25); border-radius: 999px; padding: 6px 26px; white-space: nowrap; }
      .tag b { color: var(--yellow); }
      .head { position: absolute; left: 80px; right: 80px; top: 140px; text-align: center; font: 900 68px/1.2 var(--font); color: #fff; text-shadow: 0 6px 0 rgba(10,7,32,.55); }
      .head .y, .y { color: var(--yellow); }
      .sentence { position: absolute; left: 80px; right: 80px; text-align: center; font: 900 76px/1.25 var(--font); color: #fff; text-shadow: 0 5px 0 rgba(10,7,32,.55); }
      .sentence .w, .cap .w { display: inline-block; margin: 0 .13em; }
      .ka { color: var(--yellow); text-decoration: underline; text-decoration-thickness: 8px; text-underline-offset: 14px; }
      .c-di { color: var(--pink); } .c-ke { color: var(--orange); } .c-dari { color: var(--teal); }
      .label-ka { position: absolute; font: 900 128px/1 var(--font); color: var(--yellow); letter-spacing: 2px; text-shadow: 0 8px 0 #0F0B2E; white-space: nowrap; }
      .chip { display: inline-block; font: 900 44px var(--font); color: var(--ink); border-radius: 999px; padding: 10px 30px; border: 5px solid var(--ink); white-space: nowrap; }
      .chip.di { background: var(--pink); } .chip.ke { background: var(--orange); } .chip.dari { background: var(--teal); }
      .panel { position: absolute; background: rgba(21,15,58,.82); border: 4px solid rgba(244,239,234,.25); border-radius: 36px; }
      .ok { color: #7CF5B4; } .bad { color: var(--coral); }
      .strike { text-decoration: line-through; text-decoration-thickness: 8px; text-decoration-color: var(--coral); }

      /* bar kemajuan */
      .prog { position: absolute; top: 34px; left: 560px; width: 800px; height: 72px; }
      .prog .line { position: absolute; left: 30px; right: 30px; top: 34px; border-top: 5px dashed rgba(244,239,234,.35); }
      .prog .line-done { position: absolute; left: 30px; top: 32px; height: 9px; width: 740px; border-radius: 9px; background: var(--yellow); transform-origin: 0 50%; }
      .prog .pl { position: absolute; top: 10px; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; font: 900 30px var(--font); color: var(--ink); }
      .prog .ring { position: absolute; top: 4px; width: 68px; height: 68px; margin-left: -34px; border-radius: 50%; border: 5px solid var(--yellow); }
      .prog .rkt { position: absolute; top: -20px; left: -13px; width: 86px; height: 40px; }

      /* kapsyen */
      .cap { position: absolute; left: 180px; right: 180px; bottom: 44px; text-align: center; font: 800 54px/1.3 var(--font); color: #fff; }
      .cap .box { display: inline-block; background: rgba(12,9,38,.82); border-radius: 26px; padding: 12px 34px 16px; }
      .cap .ka { text-decoration-thickness: 5px; text-underline-offset: 9px; }
      .cap .hl { position: absolute; border-radius: 12px; background: rgba(62,191,210,.38); }
    </style>
    <script>
      window.CUES = %CUES%;
    </script>
    <script>
      /* ===== Pustaka bersama: masa daripada audio sebenar + pembina SVG + animasi ===== */
      (function () {
        const C = window.CUES;
        const L = {}, S = {};
        C.lines.forEach((l) => (L[l.id] = l));
        C.sections.forEach((s) => (S[s.id] = s));
        const KA = (window.KA = {});
        KA.sec = (id) => S[id].start;
        KA.secDur = (id) => S[id].end - S[id].start;
        KA.line = (id) => L[id];
        KA.t = (id) => L[id].start - S[L[id].section].start;
        KA.end = (id) => KA.t(id) + L[id].dur;
        KA.w = (id, i) => {
          const l = L[id], ws = l.words;
          if (!ws.length) return KA.t(id);
          return ws[Math.max(0, Math.min(i, ws.length - 1))].t - S[l.section].start;
        };
        KA.chant = () => C.chant.map((c) => ({ w: c.w, t: c.t - S.rumusan.start }));
        KA.rng = (seed) => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };

        const KATA = ["atas", "bawah", "dalam", "luar", "hadapan", "belakang", "kiri", "kanan", "tepi", "tengah", "antara", "sisi"];
        const FORCE = { "18_tip_kiri_kanan": ["kiri", "kanan"], "26_tahukah_kamu": ["utara", "selatan", "timur", "barat"], "64_poin1": [], "68_chant_ajak": [] };
        const KSN = { di: "c-di", ke: "c-ke", dari: "c-dari" };
        const bare = (s) => s.toLowerCase().replace(/[^a-z]/g, "");
        KA.tokens = (id) => L[id].text.split(/\s+/).filter(Boolean);
        KA.classes = (id) => {
          const tk = KA.tokens(id), f = FORCE[id] || [];
          return tk.map((t, i) => {
            const b = bare(t), p = i ? bare(tk[i - 1]) : "";
            if (KSN[b]) return KSN[b];
            if (f.includes(b)) return "ka";
            if (KATA.includes(b) && ["di", "ke", "dari", "sebelah"].includes(p)) return "ka";
            return "";
          });
        };
        /* ayat besar di skrin, perkataan from..to-1 daripada baris */
        KA.sentence = (el, id, from = 0, to) => {
          const tk = KA.tokens(id), cl = KA.classes(id);
          to = to == null ? tk.length : to;
          el.innerHTML = "";
          const spans = [];
          for (let i = from; i < to; i++) {
            const s = document.createElement("span");
            s.className = "w " + cl[i];
            s.textContent = tk[i];
            el.appendChild(s);
            spans.push(s);
          }
          return spans;
        };
        KA.karaoke = (tl, spans, id, from = 0) => {
          spans.forEach((s, j) => {
            tl.set(s, { opacity: 0.38 }, 0);
            tl.to(s, { opacity: 1, duration: 0.12, ease: "none" }, KA.w(id, from + j) - 0.02);
          });
        };
        /* animasi asas */
        KA.pop = (tl, sel, t, dur = 0.55) => tl.fromTo(sel, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: dur, ease: "back.out(2.2)" }, t);
        KA.blurIn = (tl, sel, t, dur = 0.2) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: dur, ease: "power2.out" }, t);
        KA.fadeIn = (tl, sel, t, dur = 0.35) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur, ease: "power2.out" }, t);
        KA.out = (tl, sel, t, dur = 0.28) => tl.to(sel, { opacity: 0, filter: "blur(6px)", duration: dur, ease: "power2.in" }, t);
        KA.flicker = (tl, sel, t, dur) => tl.fromTo(sel, { scaleX: 0.82 }, { scaleX: 1.18, duration: 0.12, ease: "none", repeat: Math.max(1, Math.floor(dur / 0.12)), yoyo: true, transformOrigin: "100% 50%" }, t);
        KA.float = (tl, sel, t, dur, amp = 10, period = 2.6) => tl.fromTo(sel, { y: -amp }, { y: amp, duration: period / 2, ease: "sine.inOut", repeat: Math.max(1, Math.floor((dur * 2) / period)), yoyo: true }, t);
        KA.wave = (tl, sel, t, dur, origin) => tl.fromTo(sel, { rotation: -10 }, { rotation: 14, duration: 0.32, ease: "sine.inOut", repeat: Math.max(1, Math.floor(dur / 0.32)), yoyo: true, svgOrigin: origin }, t);
        KA.blink = (tl, sel, t, dur, origin) => { for (let x = t + 1.1; x < t + dur - 0.3; x += 3.1) { tl.to(sel, { scaleY: 0.1, duration: 0.07, svgOrigin: origin }, x).to(sel, { scaleY: 1, duration: 0.09, svgOrigin: origin }, x + 0.08); } };
        KA.warp = (tl, sel, t) => { tl.fromTo(sel, { scale: 0.25, opacity: 0 }, { scale: 1.9, opacity: 1, duration: 0.75, ease: "power2.in" }, t); tl.to(sel, { opacity: 0, duration: 0.35, ease: "power1.out" }, t + 0.75); };
        /* kad stesen: planet pop, kicker & tajuk masuk, keluar sebelum isi */
        KA.card = (tl, p, t, tOut) => {
          KA.pop(tl, `#${p}-cp`, t, 0.6);
          KA.blurIn(tl, `#${p}-ck`, t + 0.15);
          KA.blurIn(tl, `#${p}-ct`, t + 0.3, 0.25);
          tl.to(`#${p}-card`, { opacity: 0, scale: 0.92, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, tOut);
        };

        /* ===== pembina SVG watak (bahagian boleh dianimasi) ===== */
        const K = "#1A1442";
        KA.svgWarp = (seed) => {
          const r = KA.rng(seed); let s = "";
          for (let i = 0; i < 70; i++) {
            const a = r() * Math.PI * 2, d0 = 80 + r() * 260, d1 = d0 + 120 + r() * 380;
            const x0 = 960 + Math.cos(a) * d0, y0 = 540 + Math.sin(a) * d0 * 0.75, x1 = 960 + Math.cos(a) * d1, y1 = 540 + Math.sin(a) * d1 * 0.75;
            const c = ["#FFFFFF", "#D9D2FF", "#FFE7A8", "#9FE7F0"][i % 4];
            s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${c}" stroke-width="${(2 + r() * 4).toFixed(1)}" stroke-linecap="round" opacity="${(0.5 + r() * 0.5).toFixed(2)}"/>`;
          }
          return `<svg viewBox="0 0 1920 1080" width="1920" height="1080">${s}</svg>`;
        };
        KA.svgRocket = (p, o = {}) => `
<svg viewBox="0 0 300 140" width="100%" height="100%" overflow="visible">
  <g stroke="${K}" stroke-width="6" stroke-linejoin="round">
    <path d="M84 36 L64 6 H100 L126 36Z" fill="#FE585F"/><path d="M84 104 L64 134 H100 L126 104Z" fill="#FE585F"/>
    <g id="${p}-flame"><path d="M66 48 Q18 54 0 70 Q18 86 66 92Z" fill="#FE8B42"/><path d="M66 58 Q36 62 24 70 Q36 78 66 82Z" fill="#FDD13F" stroke-width="0"/></g>
    <path d="M78 34 H204 Q252 40 284 70 Q252 100 204 106 H78 Q64 106 64 92 V48 Q64 34 78 34Z" fill="#F4EFEA"/>
    <path d="M206 34.5 Q254 40 284 70 Q254 100 206 105.5 Q216 70 206 34.5Z" fill="#FE585F"/>
    <rect x="98" y="34" width="18" height="72" fill="#FE585F"/>
    <circle cx="160" cy="70" r="25" fill="#3EBFD2"/>
  </g>
  ${o.face ? `<clipPath id="${p}-clip"><circle cx="160" cy="70" r="22"/></clipPath><g clip-path="url(#${p}-clip)"><g id="${p}-face"><circle cx="160" cy="80" r="17" fill="#F6C9A3"/><path d="M142 78 Q141 58 160 57 Q179 58 178 78 Q172 68 165 66 Q158 73 150 69 Q145 71 142 78Z" fill="#5B3420"/><circle cx="154" cy="81" r="2.6" fill="${K}"/><circle cx="166" cy="81" r="2.6" fill="${K}"/><path d="M155 88 Q160 92 165 88" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/></g></g><circle cx="160" cy="70" r="25" fill="none" stroke="${K}" stroke-width="6"/>` : ""}
  <path d="M146 58 Q154 50 166 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
</svg>`;
        KA.svgWafiy = (p) => `
<svg viewBox="0 0 200 270" width="100%" height="100%" overflow="visible">
  <defs><clipPath id="${p}-vc"><ellipse cx="100" cy="88" rx="50" ry="44"/></clipPath></defs>
  <g stroke="${K}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <g id="${p}-arml"><path d="M64 158 Q42 178 40 202" fill="none" stroke-width="27"/><path d="M64 158 Q42 178 40 202" fill="none" stroke="#F4EFEA" stroke-width="17"/><circle cx="40" cy="208" r="13" fill="#FE8B42"/></g>
    <g id="${p}-arm"><path d="M136 158 Q162 142 166 112" fill="none" stroke-width="27"/><path d="M136 158 Q162 142 166 112" fill="none" stroke="#F4EFEA" stroke-width="17"/><circle cx="167" cy="104" r="14" fill="#FE8B42"/></g>

  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="g-comet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FE8B42" stop-opacity="0"/><stop offset="1" stop-color="#FE8B42"/></linearGradient>
      </defs>
      <symbol id="a-rocket" viewBox="0 0 300 140">
        <g stroke="#1A1442" stroke-width="6" stroke-linejoin="round">
          <path d="M84 36 L64 6 H100 L126 36Z" fill="#FE585F" /><path d="M84 104 L64 134 H100 L126 104Z" fill="#FE585F" />
          <path d="M66 50 Q22 56 6 70 Q22 84 66 90Z" fill="#FE8B42" /><path d="M66 58 Q38 62 28 70 Q38 78 66 82Z" fill="#FDD13F" stroke-width="0" />
          <path d="M78 34 H204 Q252 40 284 70 Q252 100 204 106 H78 Q64 106 64 92 V48 Q64 34 78 34Z" fill="#F4EFEA" />
          <path d="M206 34.5 Q254 40 284 70 Q254 100 206 105.5 Q216 70 206 34.5Z" fill="#FE585F" />
          <rect x="98" y="34" width="18" height="72" fill="#FE585F" /><circle cx="160" cy="70" r="25" fill="#3EBFD2" />
        </g>
        <path d="M146 58 Q154 50 166 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85" />
      </symbol>
