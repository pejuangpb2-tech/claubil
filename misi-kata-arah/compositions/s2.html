    (function () {
      const KA = window.KA;
      KA.put("#s2-warp", KA.svgWarp(32));
      KA.put("#s2-rkt-in", KA.svgRocket("s2r", { face: true }));
      KA.put("#s2-rkv-in", KA.svgRocket("s2v"));
      KA.put("#s2-gogo-in", KA.svgGogo("s2g"));
      KA.put("#s2-gogo2-in", KA.svgGogo("s2h"));
      KA.put("#s2-wb-in", KA.svgWafiyBack("s2b"));
      const ARR = '<path d="M6 35 H90" stroke="#FDD13F" stroke-width="13" stroke-linecap="round"/><path d="M66 10 L94 35 L66 60" fill="none" stroke="#FDD13F" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>';
      document.querySelectorAll('[id^="s2-a-"]').forEach((e) => { e.setAttribute("viewBox", "0 0 110 70"); e.innerHTML = ARR; });
      const grid = document.getElementById("s2-grid");
      ["atas", "bawah", "dalam", "luar", "hadapan", "belakang", "kiri", "kanan", "tepi", "tengah", "antara", "sisi"].forEach((w, i) => { const d = document.createElement("div"); d.className = "s2-bd"; d.id = "s2-bd" + i; d.textContent = w; grid.appendChild(d); });

      const tl = gsap.timeline({ paused: true });
      const D = KA.secDur("s2");
      const T = (id) => KA.t(id);
      KA.warp(tl, "#s2-warp", 0);
      KA.card(tl, "s2", T("11_s2_tajuk") - 0.5, T("12_atas") - 1.6);
      KA.pop(tl, "#s2-sub", KA.w("11_s2_tajuk", 5) - 0.1, 0.5);
      tl.to("#s2-sub", { opacity: 0, duration: 0.3 }, T("12_atas") - 1.6);
      tl.set("#s2-ground", { y: 500 }, 0);

      /* corak setiap kata arah: objek masuk -> label "pop" + anak panah berdenyut -> ayat karaoke */
      function item(key, id, nextT) {
        const t = T(id);
        KA.pop(tl, `#s2-l-${key}`, t - 0.05, 0.5);
        tl.fromTo(`#s2-a-${key}`, { x: 0 }, { x: 16, duration: 0.35, repeat: 5, yoyo: true, ease: "sine.inOut" }, t + 0.4);
        const spans = KA.sentence(document.getElementById(`s2-s-${key}`), id, 1);
        KA.fadeIn(tl, `#s2-s-${key}`, KA.w(id, 1) - 0.3, 0.25);
        KA.karaoke(tl, spans, id, 1);
        KA.out(tl, [`#s2-l-${key}`, `#s2-s-${key}`], nextT - 1.3, 0.3);
      }
      const tags = [["#s2-t1", "12_atas", "14_dalam"], ["#s2-t2", "14_dalam", "16_hadapan"], ["#s2-t3", "16_hadapan", "18_tip_kiri_kanan"], ["#s2-t4", "18_tip_kiri_kanan", "21_tepi"], ["#s2-t5", "21_tepi", "23_bonus"], ["#s2-t6", "23_bonus", "26_tahukah_kamu"]];
      tags.forEach(([sel, a, b]) => { KA.blurIn(tl, sel, T(a) - 1.3); KA.out(tl, sel, T(b) - 1.35, 0.25); });

      /* roket rujukan masuk */
      const t12 = T("12_atas");
      tl.fromTo("#s2-rkt", { opacity: 0, x: -900 }, { opacity: 1, x: 0, duration: 1.0, ease: "power3.out" }, t12 - 1.4);
      KA.flicker(tl, "#s2r-flame", t12 - 1.4, T("18_tip_kiri_kanan") - t12 + 1.4);
      KA.float(tl, "#s2-rkt-in", t12 - 0.4, T("18_tip_kiri_kanan") - t12, 6, 3.2);
      tl.set("#s2r-face", { opacity: 0 }, 0);
      /* 1 atas: bintang turun ke atas roket */
      tl.fromTo("#s2-star", { opacity: 0, y: -380 }, { opacity: 1, y: 0, duration: 0.9, ease: "back.out(1.4)" }, t12 - 1.1);
      item("atas", "12_atas", T("13_bawah"));
      KA.out(tl, "#s2-star", T("13_bawah") - 1.3, 0.3);
      /* 2 bawah: Bumi naik dari bawah skrin */
      const t13 = T("13_bawah");
      tl.fromTo("#s2-earth", { y: 0 }, { y: -230, duration: 1.0, ease: "power3.out" }, t13 - 1.2);
      item("bawah", "13_bawah", T("14_dalam"));
      tl.to("#s2-earth", { y: 0, duration: 0.6, ease: "power2.in" }, T("14_dalam") - 1.3);
      /* 3 dalam: zum ke tingkap, Wafiy di dalam */
      const t14 = T("14_dalam");
      tl.to("#s2-stage", { scale: 1.75, transformOrigin: "978px 486px", duration: 0.9, ease: "power2.inOut" }, t14 - 1.2);
      tl.to("#s2r-face", { opacity: 1, duration: 0.3 }, t14 - 0.6);
      tl.fromTo("#s2r-face", { y: 3 }, { y: -3, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, t14);
      item("dalam", "14_dalam", T("15_luar"));
      tl.to("#s2-stage", { scale: 1, x: 0, y: 0, duration: 0.9, ease: "power2.inOut" }, T("15_luar") - 1.3);
      /* 4 luar: Gogo terapung di luar roket */
      const t15 = T("15_luar");
      tl.fromTo("#s2-gogo", { opacity: 0, x: 400 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, t15 - 1.0);
      KA.float(tl, "#s2-gogo-in", t15 - 1, 6, 10, 2.4);
      KA.wave(tl, "#s2g-arm", t15, 4, "38 112");
      item("luar", "15_luar", T("16_hadapan"));
      tl.to("#s2-gogo", { opacity: 0, x: 400, duration: 0.5, ease: "power2.in" }, T("16_hadapan") - 1.3);
      /* 5 hadapan: bulan di arah hidung roket */
      const t16 = T("16_hadapan");
      tl.fromTo("#s2-moon", { opacity: 0, x: 500 }, { opacity: 1, x: 0, duration: 1.0, ease: "power3.out" }, t16 - 1.1);
      item("hadapan", "16_hadapan", T("17_belakang"));
      tl.to("#s2-moon", { opacity: 0, x: 500, duration: 0.5, ease: "power2.in" }, T("17_belakang") - 1.3);
      /* 6 belakang: komet meluncur di belakang roket */
      const t17 = T("17_belakang");
      tl.fromTo("#s2-comet", { opacity: 0, x: -700, y: -260 }, { opacity: 1, x: 0, y: 0, duration: 1.0, ease: "power3.out" }, t17 - 1.1);
      item("belakang", "17_belakang", T("18_tip_kiri_kanan"));
      tl.to("#s2-comet", { opacity: 0, x: -500, duration: 0.5, ease: "power2.in" }, T("18_tip_kiri_kanan") - 1.3);
      tl.to("#s2-rkt", { x: 1500, duration: 1.0, ease: "power3.in" }, T("18_tip_kiri_kanan") - 1.2);

      /* tip kiri/kanan: Wafiy dari belakang */
      const t18 = T("18_tip_kiri_kanan"), w18 = (i) => KA.w("18_tip_kiri_kanan", i);
      KA.pop(tl, "#s2-wb", t18 - 0.3, 0.6);
      KA.float(tl, "#s2-wb-in", t18, T("21_tepi") - t18, 5, 3);
      [["#s2-rl", "#s2-mk", 1], ["#s2-rr", "#s2-mn", 3]].forEach(([r, m, wi]) => {
        KA.pop(tl, r, w18(wi) - 0.05, 0.4);
        KA.blurIn(tl, m, w18(wi));
        tl.to([r, m], { opacity: 0, duration: 0.25 }, w18(wi) + 1.2);
      });
      KA.pop(tl, "#s2-tipk", w18(5) - 0.1, 0.5);
      KA.out(tl, "#s2-tipk", T("19_kiri") - 1.1, 0.3);
      [["#s2-rl", "#s2-mk", 10], ["#s2-rr", "#s2-mn", 12]].forEach(([r, m, wi]) => {
        tl.to([r, m], { opacity: 1, duration: 0.2 }, w18(wi) - 0.05);
        tl.to([r, m], { opacity: 0, duration: 0.25 }, w18(wi) + 0.9);
      });
      /* 7 kiri */
      const t19 = T("19_kiri");
